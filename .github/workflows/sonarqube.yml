name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --only-binary=:all: --no-binary=mock-open,PyRIC -r requirements-test.txt
      - name: Run tests and generate coverage
        run: python -m pytest -q --asyncio-mode=auto --cov=custom_components.openwa_whatsapp --cov-report=xml:coverage.xml
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=smarquina
            -Dsonar.projectKey=smarquina_openwa-HA
            -Dsonar.sources=custom_components
            -Dsonar.tests=tests
            -Dsonar.python.version=3.14
            -Dsonar.python.coverage.reportPaths=coverage.xml
