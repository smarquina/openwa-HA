name: OpenWA live session check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.10"
      - name: Check OpenWA session
        env:
          OPENWA_BASE_URL: ${{ secrets.OPENWA_BASE_URL }}
          OPENWA_SESSION_ID: ${{ secrets.OPENWA_SESSION_ID }}
          OPENWA_API_KEY: ${{ secrets.OPENWA_API_KEY }}
        run: python scripts/check_openwa_session.py
